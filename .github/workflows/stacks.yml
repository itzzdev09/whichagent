name: stacks
# Mines real Go and Rust repos and checks their tasks are graded per test (the v0.2 milestone check).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/whichagent/stacks.py
      - src/whichagent/grade.py
      - src/whichagent/mine.py
      - src/whichagent/testresults.py
      - .github/workflows/stacks.yml
permissions:
  contents: read
jobs:
  mine:
    strategy:
      fail-fast: false
      matrix:
        repo: [samber/lo, serde-rs/json]  # the runner image has Go and Rust installed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - run: git clone --quiet "https://github.com/${{ matrix.repo }}" target
      - run: whichagent -C target mine --max-tasks 2 --since "3 years ago"
        env:
          GH_TOKEN: ${{ github.token }}  # statements from linked issues and PRs
      - name: at least one task graded per test
        run: |
          python - <<'EOF'
          import json
          tasks = [json.loads(l) for l in open("target/.whichagent/tasks.jsonl")]
          per_test = [t["id"] for t in tasks if t.get("fail_to_pass")]
          print(f"{len(tasks)} tasks, graded per test: {per_test}")
          assert per_test, "no task is graded per test"
          EOF
